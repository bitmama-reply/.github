name: Nuovo progetto / repository
description: Apri prima di creare un repository nell'organizzazione
title: "[nuovo repo] "
labels: ["nuovo-progetto"]
body:
  - type: markdown
    attributes:
      value: |
        Serve a evitare che un repository nasca senza cliente, senza referente e senza README —
        la condizione in cui si trovano oggi la maggior parte dei repository dormienti dell'org.

  - type: input
    id: repo
    attributes:
      label: Nome del repository
      description: minuscolo, kebab-case, prefisso cliente se il cliente ha più repo
      placeholder: hera-portale-clienti
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Cliente
      description: diventa il topic `client-<slug>`
      placeholder: Hera
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Referente tecnico
      description: finisce in CODEOWNERS
      placeholder: "@nome.cognome"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Cosa fa
      description: una riga, diventa la Description del repository
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Stack
      description: diventa uno o più topic `stack-<slug>`
      placeholder: nextjs, wordpress
    validations:
      required: true

  - type: dropdown
    id: lifespan
    attributes:
      label: Durata prevista
      options:
        - Campagna o one-shot (chiude entro 6 mesi)
        - Progetto con manutenzione continuativa
        - Strumento interno
        - Sperimentazione / PoC
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Alla creazione
      options:
        - label: README compilato dal template
        - label: Topics `client-*`, `stack-*`, `status-active` impostati
        - label: CODEOWNERS presente
        - label: Protezione di `main` attiva
